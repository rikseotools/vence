name: Check Served Coverage

# Canary nocturno: detecta temas que saldrían "En desarrollo" en el hub de tests
# aunque tengan preguntas — por MV stale (materialized view sin refrescar tras
# crear/cambiar una oposición) o por `disponible=true` sin preguntas en scope.
#
# Motivación: incidente TAI 07/07/2026 (Bloque I con 7.385 preguntas salía
# "En desarrollo" porque la MV no incluía la oposición nueva). El gate manual
# `audit:served` lo caza al crear; este canary lo caza de forma CONTINUA.
#
# El trabajo lo hace el endpoint /api/cron/check-served-coverage (dentro de la
# app: BD + observabilidad in-house). Aquí solo lo invocamos y avisamos.
#
# Runbook: docs/maintenance/cache-revalidation.md (§Materialized views)
#          docs/maintenance/crear-nueva-oposicion.md (§6.bis)

on:
  schedule:
    # 05:00 UTC diario = después del cron de refresh de MV (03:30 UTC) y del
    # de stats-drift (04:00). Si la MV se refrescó bien de madrugada, aquí debe
    # salir 0 gaps; si algo quedó stale, lo cazamos.
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  check-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Call served-coverage canary endpoint
        id: check
        run: |
          RESPONSE=$(curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://www.vence.es/api/cron/check-served-coverage")

          echo "Response: $RESPONSE"

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')
          CHECKED=$(echo "$RESPONSE" | jq -r '.stats.checked // 0')
          MV_STALE=$(echo "$RESPONSE" | jq -r '.stats.mv_stale // 0')
          EMPTY=$(echo "$RESPONSE" | jq -r '.stats.empty_disponible // 0')
          TOTAL=$(echo "$RESPONSE" | jq -r '.stats.findings_total // 0')

          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "checked=$CHECKED" >> $GITHUB_OUTPUT
          echo "mv_stale=$MV_STALE" >> $GITHUB_OUTPUT
          echo "empty=$EMPTY" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # Fallar solo si el endpoint en sí falló (no si detecta gaps — eso es su
          # trabajo, ya emitido a observable_events).
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::check-served-coverage endpoint failed"
            exit 1
          fi

      - name: Summary
        run: |
          echo "🔍 Served-coverage canary — $(date)"
          echo "   Temas disponibles auditados: ${{ steps.check.outputs.checked }}"
          echo "   MV stale (saldrían En desarrollo): ${{ steps.check.outputs.mv_stale }}"
          echo "   Disponibles vacíos: ${{ steps.check.outputs.empty }}"

          if [ "${{ steps.check.outputs.total }}" != "0" ]; then
            echo "::warning::Cobertura servida con ${{ steps.check.outputs.total }} gaps (${{ steps.check.outputs.mv_stale }} MV stale, ${{ steps.check.outputs.empty }} vacíos) — ver observable_events (event_type='served_coverage_gap'). Si hay MV stale: SELECT public.refresh_topic_question_summary();"
          fi
