name: Vence Sim — canary

# Ejecuta el harness de simulación de bugs (scripts/sim) contra PRODUCCIÓN de forma
# periódica. Cada journey afirma INVARIANTES de dominio (no solo "200") y el resultado se
# emite a observable_events (event_type='sim_journey_result'). Si un journey crítico/high
# falla, el job falla (y el evento queda en observabilidad para alertar).
#
# Secrets requeridos:
#   SIM_AUTH_SECRET  = AUTH_SECRET de la app (para forjar sesión de la cuenta de test)
#   DATABASE_URL     = RDS (para emitir a observable_events)
# Recomendado: usar una CUENTA DE TEST en SIM_IDENTITY_* (no un cliente real).

on:
  workflow_dispatch:
    inputs:
      journey:
        description: 'Filtro de journey (vacío = todos)'
        required: false
        default: ''
  schedule:
    - cron: '17 */6 * * *' # cada 6h (minuto 17 para no coincidir con picos)

concurrency:
  group: sim-canary
  cancel-in-progress: false

jobs:
  sim:
    name: Simulaciones de bugs (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Correr Vence Sim contra producción
        env:
          SIM_BASE: https://www.vence.es
          SIM_EMIT: '1'
          SIM_AUTH_SECRET: ${{ secrets.SIM_AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SIM_IDENTITY_USER_ID: ${{ secrets.SIM_IDENTITY_USER_ID }}
          SIM_IDENTITY_EMAIL: ${{ secrets.SIM_IDENTITY_EMAIL }}
          SIM_IDENTITY_POSITION: ${{ secrets.SIM_IDENTITY_POSITION }}
        run: npx tsx scripts/sim/run.ts "${{ github.event.inputs.journey }}"
      - name: Subir screenshots + reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-reports
          path: sim-reports/
          retention-days: 14
