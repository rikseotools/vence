name: Tests

# Ejecuta la suite completa en cada PR y push a main.
#
# El pre-commit local solo corre unit tests (rápido). Los tests de
# integración / perf / security pegan a BD real → viven en CI.
#
# Patrón estándar (test pyramid). Ver docs/ARCHITECTURE_ROADMAP.md
# sección «Plan de ejecución activo» bloque 2.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancelar runs viejas del mismo ref si llega una nueva push… PERO NUNCA EN `main`.
#
# MEDIDO EL 28/07/2026: de los 100 últimos runs de este workflow en `main`, **57 salieron
# `cancelled`** y solo 36 llegaron a dar veredicto. Con 5-10 sesiones empujando cada pocos minutos,
# cancelar por ref significa que más de la mitad de los commits de `main` NUNCA se comprueban.
#
# Y el agujero es peor de lo que parece, porque el job que avisa lleva `if: failure() && !cancelled()`
# — correcto por sí solo (un run cancelado no dice nada), pero combinado con esto la consecuencia es
# que **un `main` roto no avisa a nadie**. Ese mismo día pasó TRES veces: un detector entraba en el
# sweep CLI sin su espejo en el @Cron, el guardarraíl de paridad se ponía rojo, su run se cancelaba
# por el push siguiente, y el fallo lo descubría la siguiente sesión al estrellarse contra el
# pre-commit (que corre la misma suite). El guardarraíl funcionaba; lo que faltaba era que alguien
# se enterara.
#
# En un PR cancelar SÍ tiene sentido: solo importa el último commit de la rama. En `main` cada
# commit es un estado que se despliega, así que cada uno merece su veredicto.
#
# Coste: ninguno. El repo es PÚBLICO y en público los minutos de Actions son gratis e ilimitados
# (y el workflow entero son ~7 min de runner: unit 2, typecheck 2, lint 1-2, integration 1).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration / perf / security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No bloquea merges hoy: hay 10 fallos conocidos (bugs datos + flaky)
    # que se irán arreglando uno a uno. Cuando llegue a 0, quitar este flag.
    continue-on-error: true
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # ── Preflight: ¿hay base de datos? ────────────────────────────────────────────
      # Si el secret no existe, GitHub lo sustituye por CADENA VACÍA: el env llega
      # puesto-pero-vacío y cada suite muere por separado con "DATABASE_URL environment
      # variable is not set". Eso son 22 errores idénticos que parecen 22 problemas y son
      # uno solo, de configuración del repo. Distinguirlo aquí es lo que permite que la
      # alerta de abajo diga CUÁL de las dos cosas pasa (T-370, 31/07/2026).
      - name: Preflight — el secret de BD existe
        id: preflight
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_REPLICA }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::El secret DATABASE_URL_REPLICA no existe o está vacío."
            echo "Sin BD, esta categoría entera (integración/perf/seguridad) NO verifica NADA:"
            echo "  invariantes de topic_scope · integridad de la entidad OEP · aislamiento entre"
            echo "  usuarios · circuito de referidos (dinero) · guardarraíles anti-scraping."
            echo "Se repone en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "✅ DATABASE_URL presente"

      - name: Run integration / perf / security tests
        id: tests
        # Solo si hay BD: sin ella, 22 suites gritando lo mismo tapan el diagnóstico.
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          # Estos tests pegan a BD real (read-only en producción + datos snapshot).
          # Suministrados como secrets del repo. Si faltan, el step falla y se
          # ve claro qué pasa — mejor que un timeout silencioso.
          DATABASE_URL: ${{ secrets.DATABASE_URL_REPLICA }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run test:integration

      # GATE de coherencia de landings (CAPA 2 determinista, sin red ni IA).
      # Falla (exit 1) si alguna landing PUBLICADA está incompleta, si el botón oficial
      # promete un boletín y lleva a otro, o si una tarjeta/temas_count no cuadra con la BD.
      # Nace del 25/07: una landing llevaba SEMANAS publicada a medias y solo se vio al ir
      # a mandarle una newsletter. Núcleos puros con tests: lib/convocatoria/{landingCompleteness,linkCoherence}.cjs
      #
      # Corre aunque los tests hayan salido rojos (son cosas distintas), pero NO sin BD.
      - name: Gate — coherencia de landings publicadas
        id: landings
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_REPLICA }}
        run: npm run audit:coherencia:gate

      # Una migración de `supabase/migrations/*.sql` mergeada a `main` NO llega sola a RDS:
      # aplicarla es manual y ningún paso de deploy lo hace. Medido el 07/08: cinco políticas RLS
      # llevaban días en `main` sin aplicar y el rol de la flota recibía CERO filas de
      # `test_questions`, `ai_verification_results`, `oep_detection_signals`, `detection_sources`
      # y `question_lifecycle_history` — sin error, así que ningún canario que solo mire
      # "¿lanzó excepción?" lo veía. El detector existía desde T-645 y no corría en NINGÚN sitio:
      # esa es la parte que esto arregla. Núcleo puro con tests: lib/db/migracionesRlsPendientes.cjs
      - name: Gate — migraciones RLS mergeadas y sin aplicar
        id: rlspend
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_REPLICA }}
        run: npm run migraciones:rls-pendientes

      # ── Que el rojo SE NOTE ───────────────────────────────────────────────────────
      # Este job lleva `continue-on-error: true` a nivel de JOB, y esa es exactamente la
      # razón de que pudiera estar roto ≥5 días sin que nadie se enterara: con él, su
      # fallo NO hace `failure()` en el workflow, así que el job `notify-failure` de abajo
      # —que corre con `if: failure()`— nunca llegaba a dispararse, no se emitía
      # `workflow_failed`, y la regla `main_ci_rojo` no tenía nada que mirar. Silencio
      # completo por diseño accidental.
      #
      # Se arregla mirando el `outcome` de los steps (que SÍ es fiable con
      # continue-on-error) y emitiendo una señal propia. No se reutiliza `workflow_failed`
      # a propósito: aquella alerta dice «nadie puede commitear ni desplegar», y eso aquí
      # es MENTIRA — este job no bloquea nada, y una alerta que exagera se acaba ignorando.
      - name: Avisar si la categoría quedó en rojo
        if: ${{ always() && (steps.preflight.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.landings.outcome == 'failure' || steps.rlspend.outcome == 'failure') }}
        env:
          INGEST_SECRET: ${{ secrets.OBSERVABILITY_INGEST_SECRET }}
        run: |
          if [ "${{ steps.preflight.outcome }}" = "failure" ]; then
            CAUSA="sin_base_de_datos"
            MSG="El gate de integración/perf/seguridad NO verificó nada: falta el secret DATABASE_URL_REPLICA"
          elif [ "${{ steps.tests.outcome }}" = "failure" ]; then
            CAUSA="tests_en_rojo"
            MSG="El gate de integración/perf/seguridad corrió con BD y tiene tests en rojo"
          elif [ "${{ steps.landings.outcome }}" = "failure" ]; then
            CAUSA="landings_incoherentes"
            MSG="El gate de coherencia de landings publicadas falló"
          else
            CAUSA="migraciones_rls_sin_aplicar"
            MSG="Hay migraciones RLS mergeadas a main y sin aplicar contra RDS (el rol de la flota lee 0 filas sin error)"
          fi

          PAYLOAD=$(jq -n \
            --arg causa "$CAUSA" \
            --arg msg "$MSG" \
            --arg sha "${{ github.sha }}" \
            --arg ref "${{ github.ref }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{events:[{
              source:"gha",
              severity:"error",
              eventType:"ci_integracion_rojo",
              endpoint:"Integration / perf / security",
              deployVersion:($sha|.[0:8]),
              errorMessage:$msg,
              metadata:{ causa:$causa, ref:$ref, runUrl:$run_url,
                         runId:"${{ github.run_id }}", actor:"${{ github.actor }}" }
            }]}')

          # Best-effort: la observabilidad no amplifica un fallo de CI.
          if [ -z "$INGEST_SECRET" ]; then
            echo "⚠️ OBSERVABILITY_INGEST_SECRET no configurado — skipping ingest"
            exit 0
          fi
          curl -sS -X POST 'https://www.vence.es/api/observability/ingest' \
            -H "Content-Type: application/json" \
            -H "x-ingest-secret: $INGEST_SECRET" \
            -d "$PAYLOAD" -o /tmp/ingest-int.txt -w "HTTP=%{http_code}\n" || echo "curl falló"
          cat /tmp/ingest-int.txt 2>/dev/null || true

      # El job sigue marcándose en rojo en la UI (informativo: `continue-on-error` a nivel
      # de job impide que tumbe el workflow, pero el rojo debe VERSE en el listado).
      # VA EL ÚLTIMO a propósito: si cortara antes, se llevaría por delante los pasos que
      # aún tienen algo que decir — que es la misma forma de ceguera que arregla esta tarea.
      - name: Reflejar el rojo en el job
        if: ${{ always() && (steps.preflight.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.landings.outcome == 'failure' || steps.rlspend.outcome == 'failure') }}
        run: exit 1

  integration-efimera:
    name: Integration (BD efímera)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    # ⚠️ [T-644] JOB NUEVO, NUNCA CORRIDO — este worker no tiene docker ni gh en su máquina y no
    # pudo verlo ejecutar ni una vez (comprobado: `which docker`/`which gh` sin salida). Por eso
    # `continue-on-error: true` a nivel de JOB, igual que `integration` de arriba cuando tenía
    # fallos sin triar: NO lo quites hasta que alguien con esas herramientas confirme un run
    # limpio en GHA real. Mientras tanto es un dato, no un gate.
    #
    # Decisión de Manuel (08/08/2026, #122/#123): estas 10 suites de test:integration ESCRIBEN
    # de verdad (dinero/referidos, borrado GDPR, ciclo de convocatoria, scope/temario) y llevan
    # detrás de INTEGRATION_DB_WRITABLE=1 desde siempre — variable que NINGÚN workflow ponía, así
    # que nunca han corrido en CI (ver docs/roadmap/tareas-pendientes.md, ficha T-644). En vez de
    # una credencial de escritura sobre producción en los secrets del repo (contradice el diseño
    # entero de la flota: vence_coordinacion sin negocio, vence_lector solo lectura, ni AWS ni
    # Stripe en esas máquinas — CI es un agente automático más), este job levanta un Postgres
    # EFÍMERO propio y restaura en él un dump de SOLO ESQUEMA de la BD real — cero riesgo sobre
    # datos de producción.
    #
    # Empieza SOLO por las 6 suites que Manuel señaló como no-dinero/no-GDPR (su condición 1:
    # "te dan la mitad del valor en un día"). Las otras 4 (referidos ×2, deleteUserData,
    # deletionLogRow) se añaden en una vuelta aparte, con más cuidado, cuando este job ya se haya
    # visto correr limpio de verdad.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Sin sslmode: el contenedor del propio job no tiene certificado — no aplica el gotcha de
      # RDS (lib/db/pgSsl.cjs, T-377), que es SOLO para conectar a la BD real.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vence_ci
      INTEGRATION_DB_WRITABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # Redundante a propósito con el guardarraíl del job `unit` (que ya para el merge si el
      # dump está viejo o ausente): si alguien dispara este job solo (workflow_dispatch) sin que
      # `unit` haya corrido, este step es la única red. Falla con el MISMO criterio —
      # lib/ci/schemaDumpFreshness.js es la fuente única, aquí no se reimplementa el umbral.
      - name: Preflight — el dump de esquema está fresco
        id: dump_fresco
        continue-on-error: true
        run: node -e "
          const { veredictoFrescura } = require('./lib/ci/schemaDumpFreshness');
          const fs = require('fs');
          let contenido;
          try { contenido = fs.readFileSync('supabase/schema-ci/schema.sql', 'utf8'); }
          catch { console.error('::error::No existe supabase/schema-ci/schema.sql — generarlo con scripts/ci/generar-dump-esquema.cjs'); process.exit(1); }
          const v = veredictoFrescura(contenido, new Date());
          if (!v.fresco) { console.error('::error::' + v.motivo); process.exit(1); }
          console.log('✅ ' + v.motivo);
          "

      - name: Restaurar el esquema en el Postgres efímero
        id: restore
        if: steps.dump_fresco.outcome == 'success'
        continue-on-error: true
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vence_ci -f supabase/schema-ci/schema.sql

      - name: Correr las 6 suites de escritura sin dinero ni GDPR
        id: tests
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          npx jest --watchAll=false --passWithNoTests \
            __tests__/integration/convocatoriaCiclo.test.ts \
            __tests__/integration/convocatoriaVerification.test.ts \
            __tests__/integration/topicScopeAudit.integration.test.ts \
            __tests__/integration/topicEpigrafeVerification.test.ts \
            __tests__/integration/topicScopeVerification.test.ts \
            __tests__/integration/testPositionTypePersistence.integration.test.ts

      - name: Reflejar el rojo en el job
        if: ${{ always() && (steps.dump_fresco.outcome == 'failure' || steps.restore.outcome == 'failure' || steps.tests.outcome == 'failure') }}
        run: exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # DEUDA CONTROLADA — fecha límite: 2026-06-30
    # 299 errores preexistentes en código de producción (no añadidos por
    # commits recientes — confirmado via git blame en sample). Desglose:
    #   146× react/no-unescaped-entities (comillas en JSX sin escapar)
    #   124× @next/next/no-html-link-for-pages (<a> en vez de <Link>)
    #    22× react-hooks/rules-of-hooks (posibles bugs reales)
    #     7× misc (display-name, no-children-prop, jsx-no-undef)
    # Plan: arreglar en sesión dedicada (2-4h con scripts + revisión
    # manual de los 22 rules-of-hooks). Quitar este flag cuando esté a 0.
    # Tracking: tarea pendiente.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  # ════════════════════════════════════════════════════════════════
  # Bloque 4 Gap 6 — notificación de fallos a observable_events
  # ════════════════════════════════════════════════════════════════
  # Reporta cualquier fallo de los jobs anteriores como evento
  # `workflow_failed` en observable_events. Permite que el cron
  # `alerts-engine` del backend dispare alerta automática (regla
  # deploy_failed o cron_failure_burst si hay varios).
  #
  # `needs` con `if: failure() && !cancelled()` garantiza que SOLO
  # corre cuando algún job anterior falló (no en éxito ni en cancel
  # por concurrency.cancel-in-progress).
  notify-failure:
    name: Notify failure to observable_events
    if: ${{ failure() && !cancelled() }}
    needs: [unit, integration, integration-efimera, lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST to /api/observability/ingest
        env:
          INGEST_SECRET: ${{ secrets.OBSERVABILITY_INGEST_SECRET }}
        run: |
          # Construir payload con metadata del run.
          # `jq` ya disponible en runners ubuntu-latest.
          PAYLOAD=$(jq -n \
            --arg workflow "${{ github.workflow }}" \
            --arg job_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg event "${{ github.event_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg ref "${{ github.ref }}" \
            '{events:[{
              source:"gha",
              severity:"error",
              eventType:"workflow_failed",
              endpoint:$workflow,
              deployVersion:($sha|.[0:8]),
              errorMessage:("Workflow " + $workflow + " falló en " + $event),
              metadata:{
                workflow:$workflow,
                runId:"${{ github.run_id }}",
                runUrl:$job_url,
                actor:$actor,
                ref:$ref,
                attempt:"${{ github.run_attempt }}"
              }
            }]}')

          # Best-effort: si INGEST_SECRET no está configurado o el
          # endpoint cae, NO fallar el step (no queremos amplificar
          # un fallo de CI con un fallo de observability).
          if [ -z "$INGEST_SECRET" ]; then
            echo "⚠️ OBSERVABILITY_INGEST_SECRET no configurado — skipping ingest"
            exit 0
          fi

          curl -sS -X POST 'https://www.vence.es/api/observability/ingest' \
            -H "Content-Type: application/json" \
            -H "x-ingest-secret: $INGEST_SECRET" \
            -d "$PAYLOAD" \
            -o /tmp/ingest.txt \
            -w "HTTP=%{http_code}\n" || echo "curl falló"
          cat /tmp/ingest.txt 2>/dev/null || true
