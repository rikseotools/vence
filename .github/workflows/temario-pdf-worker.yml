# Worker de generación de PDFs del temario (T-086 Fase D) — hogar operativo OFF-SERVING.
#
# Por qué GHA y no un @Cron backend ni un endpoint (patrón de conversion-outbox): el render de
# @react-pdf es pesado (un cajón tarda ~72 s / ~1,4 GB) y BLOQUEA el event loop → en una task que
# sirve tráfico falla health checks y la matan. Necesita correr aislado. El runner de GHA no sirve
# tráfico, tiene @react-pdf (npm ci) y conecta directo a RDS (público+SSL) y a S3 (rol OIDC).
#
# Flujo: enqueue-big (encola los temas que no caben síncronos) → drain (renderiza → S3, retry/DLQ).
# La descarga sirve de S3 si existe (route ya cache-first) → los grandes dejan de dar 413.
#
# Requiere secrets: DATABASE_URL (RDS), AWS_DEPLOY_ROLE_ARN (con permiso s3:PutObject sobre
# vence-uploads/temario-pdf/*). Idempotente y reanudable: re-ejecutarlo salta lo ya cacheado
# (pregenerate content-addressed, force=false) y rescata jobs colgados (requeueStale al arrancar).

name: temario-pdf-worker

on:
  workflow_dispatch:
    inputs:
      min_total:
        description: 'Umbral total de chars para encolar (default 400000)'
        required: false
        default: '400000'
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC diario — mantiene la caché fresca (regenera lo que cambió)

# Un solo worker a la vez: si se solapan runs, que no compitan por la cola (el SKIP LOCKED lo
# toleraría, pero no tiene sentido pagar 2 runners).
concurrency:
  group: temario-pdf-worker
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_S3_REGION: eu-west-2
  AWS_S3_BUCKET: vence-uploads

permissions:
  id-token: write   # OIDC para asumir el rol AWS
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # margen: drenar todos los cajones puede llevar 1-2 h
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Enqueue temas grandes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx -r tsconfig-paths/register scripts/pdf-worker.ts enqueue-big "${{ github.event.inputs.min_total || '400000' }}"

      - name: Drain (render → S3)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx -r tsconfig-paths/register scripts/pdf-worker.ts drain

      - name: Stats + alerta DLQ
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          OUT=$(npx tsx -r tsconfig-paths/register scripts/pdf-worker.ts stats 2>/dev/null | tail -1)
          echo "$OUT"
          echo "$OUT" | grep -q "failed: 0" || echo "::warning::temario-pdf-worker DLQ no vacía — hay temas que fallaron tras los reintentos. Inspeccionar temario_pdf_jobs WHERE status='failed'."
